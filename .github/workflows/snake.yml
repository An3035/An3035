name: Generate Snake
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # 关键：授予bot提交代码权限，自动使用内置GITHUB_TOKEN，解决缺Token报错
    permissions:
      contents: write
    env:
      # 消除Node.js20弃用警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: An3035
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Commit files
        run: >
          git config user.name "github-actions[bot]" &&
          git config user.email "github-actions[bot]@users.noreply.github.com" &&
          git add . &&
          (git diff --cached --quiet || git commit -m "chore: update snake animation" && git push)
